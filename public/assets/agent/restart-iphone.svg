<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" role="img" aria-label="Принудительная перезагрузка iPhone 8 и новее: 1 — громкость вверх, 2 — громкость вниз, 3 — держать боковую кнопку до яблока">
  <!-- Схема для помощника сайта (план 123, 26.10.2026). Шрифт системный: SVG в <img> веб-шрифты не грузит. -->
  <rect width="520" height="330" rx="16" fill="#1d1d1d"/>
  <text x="260" y="34" text-anchor="middle" fill="#f5e6c8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Перезагрузка iPhone 8 и новее</text>
  <text x="260" y="54" text-anchor="middle" fill="#b1a796" font-family="Arial, Helvetica, sans-serif" font-size="12.5">быстро, по порядку: 1 → 2 → 3</text>

  <!-- телефон -->
  <rect x="205" y="72" width="110" height="228" rx="20" fill="#2f2f2f" stroke="#90897f" stroke-width="2"/>
  <rect x="213" y="82" width="94" height="208" rx="13" fill="#141414"/>
  <rect x="244" y="88" width="32" height="8" rx="4" fill="#2f2f2f"/>
  <!-- кнопки: слева громкость, справа боковая -->
  <rect x="199" y="122" width="6" height="26" rx="2" fill="#d4a012"/>
  <rect x="199" y="156" width="6" height="26" rx="2" fill="#d4a012"/>
  <rect x="315" y="132" width="6" height="44" rx="2" fill="#d4a012"/>

  <!-- 1 -->
  <line x1="196" y1="135" x2="150" y2="118" stroke="#d4a012" stroke-width="1.5"/>
  <circle cx="136" cy="113" r="14" fill="#d4a012"/>
  <text x="136" y="118" text-anchor="middle" fill="#141414" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">1</text>
  <text x="118" y="104" text-anchor="end" fill="#f5e6c8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700">Громкость +</text>
  <text x="118" y="122" text-anchor="end" fill="#b1a796" font-family="Arial, Helvetica, sans-serif" font-size="12.5">нажать и отпустить</text>

  <!-- 2 -->
  <line x1="196" y1="169" x2="150" y2="186" stroke="#d4a012" stroke-width="1.5"/>
  <circle cx="136" cy="191" r="14" fill="#d4a012"/>
  <text x="136" y="196" text-anchor="middle" fill="#141414" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">2</text>
  <text x="118" y="182" text-anchor="end" fill="#f5e6c8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700">Громкость −</text>
  <text x="118" y="200" text-anchor="end" fill="#b1a796" font-family="Arial, Helvetica, sans-serif" font-size="12.5">нажать и отпустить</text>

  <!-- 3 -->
  <line x1="324" y1="154" x2="362" y2="154" stroke="#d4a012" stroke-width="1.5"/>
  <circle cx="376" cy="154" r="14" fill="#d4a012"/>
  <text x="376" y="159" text-anchor="middle" fill="#141414" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">3</text>
  <text x="396" y="140" fill="#f5e6c8" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700">Боковая</text>
  <text x="396" y="158" fill="#b1a796" font-family="Arial, Helvetica, sans-serif" font-size="12.5">держать, пока</text>
  <text x="396" y="174" fill="#b1a796" font-family="Arial, Helvetica, sans-serif" font-size="12.5">не появится яблоко</text>
  <text x="396" y="190" fill="#b1a796" font-family="Arial, Helvetica, sans-serif" font-size="12.5">(10–20 секунд)</text>

  <!-- на экране -->
  <text x="260" y="196" text-anchor="middle" fill="#d4a012" font-family="Arial, Helvetica, sans-serif" font-size="34">↻</text>
  <text x="260" y="320" text-anchor="middle" fill="#90897f" font-family="Arial, Helvetica, sans-serif" font-size="11.5">Экран может сначала погаснуть — кнопку не отпускайте</text>
</svg>
