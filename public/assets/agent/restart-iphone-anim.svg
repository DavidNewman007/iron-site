<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" role="img" aria-label="Анимация: рука держит iPhone — большой палец нажимает громкость вверх, затем громкость вниз, указательный держит боковую кнопку 10–20 секунд до яблока">
  <!-- Анимированная схема для помощника сайта, бота заказов и агента лички (план 123).
       v5 26.10.2026: рука переделана полностью по просьбе владельца («анимация не нравится, переделай руку полностью»;
       раньше — «пальцы отдельно смотрятся странно», «палец похож на фак»). Теперь одна рука ДЕРЖИТ телефон, как в
       жизни: большой палец на левом торце жмёт громкость, указательный обхватывает правый край и держит боковую,
       ладонь — под телефоном. Цикл 24 с; удержание — 15 с в реальном времени со счётчиком; экран гаснет, яблоко.
       Только CSS-анимация: SVG в <img> скрипты не выполняет. Видео — scripts/svg-anim-to-mp4.mjs из этого файла. -->
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .th { animation: th 24s infinite ease-in-out; }
    .ix { animation: ix 24s infinite ease-in-out; }
    .v1 { animation: v1 24s infinite; } .v2 { animation: v2 24s infinite; } .sb { animation: sb 24s infinite; }
    .sbg { animation: sbg 24s infinite; }
    @keyframes sbg { 0%, 18.7%, 81.3%, 100% { opacity: 0; } 18.75%, 81.25% { opacity: 0.45; } }
    .bar { animation: bar 24s infinite linear; transform-box: fill-box; transform-origin: left center; }
    .off { animation: off 24s infinite; } .logo { animation: logo 24s infinite; }
    .s1 { animation: s1 24s infinite; } .s2 { animation: s2 24s infinite; }
    .s3 { animation: s3 24s infinite; } .s4 { animation: s4 24s infinite; }
    .c { opacity: 0; animation: c 24s infinite; }
    /* большой палец: жмёт «громкость +», скользит к «громкость −», жмёт; к концу цикла возвращается */
    @keyframes th {
      0%, 5.2% { transform: translate(0, 0); } 5.8%, 7.1% { transform: translate(4px, 0); } 7.5%, 9.2% { transform: translate(0, 0); }
      10.8% { transform: translate(0, 54px); } 11.25%, 12.5% { transform: translate(4px, 54px); } 12.9%, 96% { transform: translate(0, 54px); }
      100% { transform: translate(0, 0); }
    }
    /* указательный: держит боковую 15 с */
    /* указательный: до шага 3 лежит НИЖЕ боковой кнопки (раньше всю анимацию лежал поперёк и «резал её пополам» —
       замечание владельца 26.10), на шаге 3 поднимается на кнопку, жмёт и держит, потом опускается */
    @keyframes ix {
      0%, 15.5% { transform: translate(0, 0); } 18.3% { transform: translate(0, -44px); }
      18.75%, 81.25% { transform: translate(-5px, -44px); } 82.5% { transform: translate(0, -44px); } 86%, 100% { transform: translate(0, 0); }
    }
    @keyframes v1 { 0%, 5.7%, 7.2%, 100% { fill: #d4a012; } 5.8%, 7.1% { fill: #ffe27a; } }
    @keyframes v2 { 0%, 11.2%, 12.6%, 100% { fill: #d4a012; } 11.25%, 12.5% { fill: #ffe27a; } }
    @keyframes sb { 0%, 18.7%, 81.3%, 100% { fill: #d4a012; } 18.75%, 81.25% { fill: #ffe27a; } }
    @keyframes bar { 0%, 18.75% { transform: scaleX(0); } 81.25%, 100% { transform: scaleX(1); } }
    @keyframes off { 0%, 26.5% { opacity: 0; } 28%, 99.5% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes logo { 0%, 78.5% { opacity: 0; } 80%, 99.5% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes s1 { 0%, 8.4% { opacity: 1; } 9%, 100% { opacity: 0; } }
    @keyframes s2 { 0%, 8.4% { opacity: 0; } 9%, 15.9% { opacity: 1; } 16.4%, 100% { opacity: 0; } }
    @keyframes s3 { 0%, 15.9% { opacity: 0; } 16.4%, 78.8% { opacity: 1; } 79.4%, 100% { opacity: 0; } }
    @keyframes s4 { 0%, 78.8% { opacity: 0; } 79.4%, 99.5% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes c { 0%, 4.1% { opacity: 1; } 4.17%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .th, .ix, .v1, .v2, .sb, .bar, .off, .logo, .s1, .s2, .s3, .s4, .c { animation: none; }
      .s2, .s3, .s4, .off, .logo { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a17b"/><stop offset="0.55" stop-color="#ebb994"/><stop offset="1" stop-color="#d69c75"/>
    </linearGradient>
    <linearGradient id="skinV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efc2a0"/><stop offset="1" stop-color="#d49a73"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22324a"/><stop offset="1" stop-color="#3a2340"/>
    </linearGradient>
  </defs>

  <rect width="640" height="600" rx="22" fill="#1b1b1b"/>
  <text x="320" y="46" text-anchor="middle" fill="#f5e6c8" font-size="28" font-weight="700">Перезагрузка iPhone 8 и новее</text>

  <!-- пальцы за телефоном (средний, безымянный, мизинец): видны подушечки справа -->
  <g stroke="#a8714f" stroke-width="1.6">
    <rect x="300" y="282" width="124" height="36" rx="18" fill="url(#skinV)"/>
    <rect x="300" y="324" width="118" height="34" rx="17" fill="url(#skinV)"/>
    <rect x="300" y="362" width="106" height="28" rx="14" fill="url(#skinV)"/>
  </g>
  <!-- ладонь за телефоном и рукав -->
  <path d="M150 600 C150 520 160 450 182 404 C196 372 214 344 236 330 L330 330 C380 332 418 356 424 390 C430 424 420 470 400 520 L392 600 Z"
        fill="url(#skin)" stroke="#a8714f" stroke-width="2"/>
  <path d="M120 600 C126 560 140 530 160 512 L400 512 C410 540 414 570 414 600 Z" fill="#3c4250"/>

  <!-- телефон -->
  <rect x="245" y="72" width="150" height="320" rx="30" fill="#2f2f2f" stroke="#90897f" stroke-width="3"/>
  <rect x="256" y="83" width="128" height="298" rx="21" fill="url(#wall)"/>
  <rect x="298" y="91" width="44" height="12" rx="6" fill="#141414"/>
  <text x="320" y="160" text-anchor="middle" fill="#dfe6f1" font-size="34" font-weight="300">9:41</text>
  <text x="320" y="246" text-anchor="middle" fill="#b9c4d6" font-size="15">экран завис</text>
  <rect class="off" x="256" y="83" width="128" height="298" rx="21" fill="#000"/>
  <g class="logo" transform="translate(293 196) scale(2.25)">
    <path fill="#f4f4f4" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
  </g>

  <!-- кнопки -->
  <rect class="v1" x="236" y="158" width="10" height="40" rx="3"/>
  <rect class="v2" x="236" y="212" width="10" height="40" rx="3"/>
  <rect class="sbg" x="391" y="181" width="16" height="54" rx="6" fill="#ffd54a" opacity="0"/>
  <rect class="sb" x="394" y="184" width="10" height="48" rx="3"/>

  <!-- указательный: обхватывает правый край, подушечка на боковой кнопке. Палец за корпусом — видна только часть
       правее края телефона (clipPath), поэтому он рисуется поверх кнопки и не залезает на экран. -->
  <clipPath id="rightOfPhone"><rect x="393" y="150" width="120" height="140"/></clipPath>
  <g clip-path="url(#rightOfPhone)">
    <g class="ix">
      <rect x="300" y="232" width="128" height="40" rx="20" fill="url(#skinV)" stroke="#a8714f" stroke-width="1.6"/>
    </g>
  </g>

  <!-- большой палец: вдоль левого торца, кончик на кнопке громкости -->
  <g class="th">
    <path d="M196 476 C192 420 196 334 206 270 C212 232 220 198 228 178 C232 168 246 166 249 176 C252 192 252 230 250 266 C247 330 246 410 248 476 Z"
          fill="url(#skin)" stroke="#a8714f" stroke-width="2"/>
    <path d="M231 182 C234 173 245 172 247 181 L246 204 C243 210 234 210 232 204 Z" fill="#f6dccb" stroke="#c99374" stroke-width="1.2"/>
    <path d="M210 304 C218 308 232 308 242 304" stroke="#a8714f" stroke-width="1.5" fill="none"/>
  </g>

  <!-- номера кнопок — левее и правее руки -->
  <circle cx="178" cy="178" r="16" fill="#d4a012"/><text x="178" y="184" text-anchor="middle" fill="#141414" font-size="18" font-weight="700">1</text>
  <line x1="194" y1="178" x2="222" y2="178" stroke="#d4a012" stroke-width="2"/>
  <circle cx="178" cy="232" r="16" fill="#d4a012"/><text x="178" y="238" text-anchor="middle" fill="#141414" font-size="18" font-weight="700">2</text>
  <line x1="194" y1="232" x2="222" y2="232" stroke="#d4a012" stroke-width="2"/>
  <circle cx="470" cy="208" r="16" fill="#d4a012"/><text x="470" y="214" text-anchor="middle" fill="#141414" font-size="18" font-weight="700">3</text>
  <line x1="432" y1="208" x2="454" y2="208" stroke="#d4a012" stroke-width="2"/>

  <!-- счётчик удержания: 1…15 с со сдвигом от начала удержания (4,5 с) -->
  <g font-size="34" font-weight="700" fill="#ffd54a" text-anchor="middle">
    <text class="c" x="540" y="262" style="animation-delay:4.5s">1 с</text>
    <text class="c" x="540" y="262" style="animation-delay:5.5s">2 с</text>
    <text class="c" x="540" y="262" style="animation-delay:6.5s">3 с</text>
    <text class="c" x="540" y="262" style="animation-delay:7.5s">4 с</text>
    <text class="c" x="540" y="262" style="animation-delay:8.5s">5 с</text>
    <text class="c" x="540" y="262" style="animation-delay:9.5s">6 с</text>
    <text class="c" x="540" y="262" style="animation-delay:10.5s">7 с</text>
    <text class="c" x="540" y="262" style="animation-delay:11.5s">8 с</text>
    <text class="c" x="540" y="262" style="animation-delay:12.5s">9 с</text>
    <text class="c" x="540" y="262" style="animation-delay:13.5s">10 с</text>
    <text class="c" x="540" y="262" style="animation-delay:14.5s">11 с</text>
    <text class="c" x="540" y="262" style="animation-delay:15.5s">12 с</text>
    <text class="c" x="540" y="262" style="animation-delay:16.5s">13 с</text>
    <text class="c" x="540" y="262" style="animation-delay:17.5s">14 с</text>
    <text class="c" x="540" y="262" style="animation-delay:18.5s">15 с</text>
  </g>

  <!-- субтитры и полоска удержания -->
  <rect x="0" y="436" width="640" height="164" fill="#111"/>
  <g class="s1">
    <text x="320" y="496" text-anchor="middle" fill="#ffd54a" font-size="40" font-weight="700">1 · Громкость +</text>
    <text x="320" y="542" text-anchor="middle" fill="#f5e6c8" font-size="27">нажать и сразу отпустить</text>
  </g>
  <g class="s2" opacity="0">
    <text x="320" y="496" text-anchor="middle" fill="#ffd54a" font-size="40" font-weight="700">2 · Громкость −</text>
    <text x="320" y="542" text-anchor="middle" fill="#f5e6c8" font-size="27">нажать и сразу отпустить</text>
  </g>
  <g class="s3" opacity="0">
    <text x="320" y="496" text-anchor="middle" fill="#ffd54a" font-size="40" font-weight="700">3 · Держите боковую</text>
    <text x="320" y="542" text-anchor="middle" fill="#f5e6c8" font-size="25">10–20 секунд, экран погаснет — не отпускайте</text>
  </g>
  <g class="s4" opacity="0">
    <text x="320" y="496" text-anchor="middle" fill="#7fd48a" font-size="40" font-weight="700">Появилось яблоко ✓</text>
    <text x="320" y="542" text-anchor="middle" fill="#f5e6c8" font-size="27">отпускайте — телефон загружается</text>
  </g>
  <rect x="170" y="568" width="300" height="9" rx="4.5" fill="#333"/>
  <rect class="bar" x="170" y="568" width="300" height="9" rx="4.5" fill="#d4a012"/>
</svg>
