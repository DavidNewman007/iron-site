<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" role="img" aria-label="Анимация: принудительная перезагрузка iPhone 8 и новее — громкость вверх, громкость вниз, держать боковую кнопку до логотипа">
  <!-- Анимированная схема для помощника сайта (план 123, 26.10.2026; владелец: «можно ли сделать анимацию
       перезагрузки, чтобы отправлять в чат помощника»). Только CSS-анимация: SVG в <img> скрипты не выполняет.
       Цикл 10 с: 1 — громкость +, 2 — громкость −, 3 — держать боковую, экран гаснет, появляется логотип. -->
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .btn { fill: #d4a012; }
    .b1 { animation: press-l 10s infinite; }
    .b2 { animation: press-l2 10s infinite; }
    .b3 { animation: hold-r 10s infinite; }
    .n1 { animation: pulse1 10s infinite; transform-box: fill-box; transform-origin: center; }
    .n2 { animation: pulse2 10s infinite; transform-box: fill-box; transform-origin: center; }
    .n3 { animation: pulse3 10s infinite; transform-box: fill-box; transform-origin: center; }
    .bar { animation: fill 10s infinite; transform-box: fill-box; transform-origin: left center; }
    .screen-off { animation: off 10s infinite; }
    .logo { animation: logo 10s infinite; }
    .c1 { animation: cap1 10s infinite; } .c2 { animation: cap2 10s infinite; }
    .c3 { animation: cap3 10s infinite; } .c4 { animation: cap4 10s infinite; }
    @keyframes press-l  { 0%,8%,18%,100% { transform: translateX(0); fill: #d4a012; } 10%,15% { transform: translateX(4px); fill: #ffd54a; } }
    @keyframes press-l2 { 0%,22%,32%,100% { transform: translateX(0); fill: #d4a012; } 24%,29% { transform: translateX(4px); fill: #ffd54a; } }
    @keyframes hold-r   { 0%,36%,80%,100% { transform: translateX(0); fill: #d4a012; } 38%,78% { transform: translateX(-4px); fill: #ffd54a; } }
    @keyframes pulse1 { 0%,8%,18%,100% { transform: scale(1); } 12% { transform: scale(1.25); } }
    @keyframes pulse2 { 0%,22%,32%,100% { transform: scale(1); } 26% { transform: scale(1.25); } }
    @keyframes pulse3 { 0%,36%,100% { transform: scale(1); } 40%,76% { transform: scale(1.18); } 80% { transform: scale(1); } }
    @keyframes fill { 0%,38% { transform: scaleX(0); } 78%,100% { transform: scaleX(1); } }
    @keyframes off  { 0%,55% { opacity: 0; } 58%,68% { opacity: 1; } 72%,100% { opacity: 0; } }
    @keyframes logo { 0%,68% { opacity: 0; } 72%,96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes cap1 { 0%,19% { opacity: 1; } 21%,100% { opacity: 0; } }
    @keyframes cap2 { 0%,20% { opacity: 0; } 22%,34% { opacity: 1; } 36%,100% { opacity: 0; } }
    @keyframes cap3 { 0%,35% { opacity: 0; } 37%,69% { opacity: 1; } 71%,100% { opacity: 0; } }
    @keyframes cap4 { 0%,70% { opacity: 0; } 72%,98% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .b1, .b2, .b3, .n1, .n2, .n3, .bar, .screen-off, .logo, .c1, .c2, .c3, .c4 { animation: none; }
      .c2, .c3, .c4, .logo, .screen-off { opacity: 0; }
    }
  </style>

  <rect width="520" height="330" rx="16" fill="#1d1d1d"/>
  <text x="260" y="34" text-anchor="middle" fill="#f5e6c8" font-size="17" font-weight="700">Перезагрузка iPhone 8 и новее</text>
  <text x="260" y="54" text-anchor="middle" fill="#b1a796" font-size="12.5">быстро, по порядку: 1 → 2 → 3</text>

  <!-- телефон -->
  <rect x="205" y="72" width="110" height="228" rx="20" fill="#2f2f2f" stroke="#90897f" stroke-width="2"/>
  <rect x="213" y="82" width="94" height="208" rx="13" fill="#141414"/>
  <rect x="244" y="88" width="32" height="8" rx="4" fill="#2f2f2f"/>
  <!-- экран: гаснет, затем логотип (нейтральный знак, не логотип Apple) -->
  <rect class="screen-off" x="213" y="82" width="94" height="208" rx="13" fill="#000"/>
  <g class="logo">
    <circle cx="260" cy="180" r="15" fill="#f1ede3"/>
    <text x="260" y="222" text-anchor="middle" fill="#f1ede3" font-size="10.5">логотип</text>
  </g>

  <!-- кнопки -->
  <rect class="btn b1" x="199" y="122" width="6" height="26" rx="2"/>
  <rect class="btn b2" x="199" y="156" width="6" height="26" rx="2"/>
  <rect class="btn b3" x="315" y="132" width="6" height="44" rx="2"/>

  <!-- 1 -->
  <line x1="196" y1="135" x2="150" y2="118" stroke="#d4a012" stroke-width="1.5"/>
  <g class="n1"><circle cx="136" cy="113" r="14" fill="#d4a012"/>
    <text x="136" y="118" text-anchor="middle" fill="#141414" font-size="15" font-weight="700">1</text></g>
  <text x="118" y="104" text-anchor="end" fill="#f5e6c8" font-size="13.5" font-weight="700">Громкость +</text>
  <text x="118" y="122" text-anchor="end" fill="#b1a796" font-size="12.5">нажать и отпустить</text>

  <!-- 2 -->
  <line x1="196" y1="169" x2="150" y2="186" stroke="#d4a012" stroke-width="1.5"/>
  <g class="n2"><circle cx="136" cy="191" r="14" fill="#d4a012"/>
    <text x="136" y="196" text-anchor="middle" fill="#141414" font-size="15" font-weight="700">2</text></g>
  <text x="118" y="182" text-anchor="end" fill="#f5e6c8" font-size="13.5" font-weight="700">Громкость −</text>
  <text x="118" y="200" text-anchor="end" fill="#b1a796" font-size="12.5">нажать и отпустить</text>

  <!-- 3 -->
  <line x1="324" y1="154" x2="362" y2="154" stroke="#d4a012" stroke-width="1.5"/>
  <g class="n3"><circle cx="376" cy="154" r="14" fill="#d4a012"/>
    <text x="376" y="159" text-anchor="middle" fill="#141414" font-size="15" font-weight="700">3</text></g>
  <text x="396" y="140" fill="#f5e6c8" font-size="13.5" font-weight="700">Боковая</text>
  <text x="396" y="158" fill="#b1a796" font-size="12.5">держать, пока</text>
  <text x="396" y="174" fill="#b1a796" font-size="12.5">не появится</text>
  <text x="396" y="190" fill="#b1a796" font-size="12.5">логотип</text>
  <!-- полоска удержания 10–20 с -->
  <rect x="396" y="200" width="100" height="6" rx="3" fill="#3a3a3a"/>
  <rect class="bar" x="396" y="200" width="100" height="6" rx="3" fill="#d4a012"/>
  <text x="396" y="222" fill="#90897f" font-size="11">10–20 секунд</text>

  <!-- подписи шагов -->
  <text class="c1" x="260" y="320" text-anchor="middle" fill="#f5e6c8" font-size="13">1 — громкость вверх: нажать и сразу отпустить</text>
  <text class="c2" x="260" y="320" text-anchor="middle" fill="#f5e6c8" font-size="13" opacity="0">2 — громкость вниз: нажать и сразу отпустить</text>
  <text class="c3" x="260" y="320" text-anchor="middle" fill="#f5e6c8" font-size="13" opacity="0">3 — держать боковую; экран погаснет — не отпускайте</text>
  <text class="c4" x="260" y="320" text-anchor="middle" fill="#ffd54a" font-size="13" opacity="0">Появился логотип — отпускайте: телефон загружается</text>
</svg>
