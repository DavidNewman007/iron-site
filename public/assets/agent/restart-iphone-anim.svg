<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-label="Анимация: принудительная перезагрузка iPhone 8 и новее — палец нажимает громкость вверх, громкость вниз, затем держит боковую кнопку до логотипа">
  <!-- Анимированная схема для помощника сайта (план 123). v2 26.10.2026 по просьбе владельца: «крупнее… анимацию руки,
       как нажимать, и крупные красивые субтитры». Только CSS-анимация: SVG в <img> скрипты не выполняет.
       Цикл 12 с: палец жмёт «громкость +», «громкость −», большой палец держит боковую, экран гаснет, логотип. -->
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .lf { animation: lf 12s infinite ease-in-out; }
    .rt { animation: rt 12s infinite ease-in-out; }
    .v1 { animation: v1 12s infinite; } .v2 { animation: v2 12s infinite; } .sb { animation: sb 12s infinite; }
    .bar { animation: bar 12s infinite linear; transform-box: fill-box; transform-origin: left center; }
    .off { animation: off 12s infinite; } .logo { animation: logo 12s infinite; }
    .s1 { animation: s1 12s infinite; } .s2 { animation: s2 12s infinite; }
    .s3 { animation: s3 12s infinite; } .s4 { animation: s4 12s infinite; }
    @keyframes lf {
      0% { transform: translate(-190px, -26px); } 9% { transform: translate(0, -26px); }
      12%, 15% { transform: translate(6px, -26px); } 17% { transform: translate(0, -26px); }
      23% { transform: translate(0, 26px); } 26%, 29% { transform: translate(6px, 26px); } 31% { transform: translate(0, 26px); }
      37%, 100% { transform: translate(-190px, 26px); }
    }
    @keyframes rt {
      0%, 34% { transform: translateX(230px); } 41% { transform: translateX(0); }
      43%, 79% { transform: translateX(-6px); } 82% { transform: translateX(0); } 88%, 100% { transform: translateX(230px); }
    }
    @keyframes v1 { 0%, 11%, 16%, 100% { fill: #d4a012; transform: translateX(0); } 12%, 15% { fill: #ffd54a; transform: translateX(5px); } }
    @keyframes v2 { 0%, 25%, 30%, 100% { fill: #d4a012; transform: translateX(0); } 26%, 29% { fill: #ffd54a; transform: translateX(5px); } }
    @keyframes sb { 0%, 42%, 80%, 100% { fill: #d4a012; transform: translateX(0); } 43%, 79% { fill: #ffd54a; transform: translateX(-5px); } }
    @keyframes bar { 0%, 43% { transform: scaleX(0); } 79%, 100% { transform: scaleX(1); } }
    @keyframes off { 0%, 60% { opacity: 0; } 62%, 72% { opacity: 1; } 75%, 100% { opacity: 0; } }
    @keyframes logo { 0%, 73% { opacity: 0; } 76%, 97% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes s1 { 0%, 19% { opacity: 1; } 20.5%, 100% { opacity: 0; } }
    @keyframes s2 { 0%, 20% { opacity: 0; } 21.5%, 34% { opacity: 1; } 35.5%, 100% { opacity: 0; } }
    @keyframes s3 { 0%, 35% { opacity: 0; } 36.5%, 73% { opacity: 1; } 74.5%, 100% { opacity: 0; } }
    @keyframes s4 { 0%, 74% { opacity: 0; } 75.5%, 99% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .lf, .rt, .v1, .v2, .sb, .bar, .off, .logo, .s1, .s2, .s3, .s4 { animation: none; }
      .lf, .rt { transform: translate(-190px, 0); } .s2, .s3, .s4, .off, .logo { opacity: 0; }
    }
  </style>

  <rect width="600" height="560" rx="20" fill="#1b1b1b"/>
  <text x="300" y="46" text-anchor="middle" fill="#f5e6c8" font-size="26" font-weight="700">Перезагрузка iPhone 8 и новее</text>

  <!-- телефон -->
  <rect x="220" y="80" width="160" height="320" rx="30" fill="#2f2f2f" stroke="#90897f" stroke-width="3"/>
  <rect x="231" y="92" width="138" height="296" rx="21" fill="#141414"/>
  <rect x="276" y="100" width="48" height="12" rx="6" fill="#2f2f2f"/>
  <rect class="off" x="231" y="92" width="138" height="296" rx="21" fill="#000"/>
  <g class="logo">
    <circle cx="300" cy="232" r="22" fill="#f1ede3"/>
    <text x="300" y="286" text-anchor="middle" fill="#f1ede3" font-size="15">логотип</text>
  </g>

  <!-- кнопки: громкость слева, боковая справа -->
  <rect class="v1" x="212" y="168" width="9" height="40" rx="3"/>
  <rect class="v2" x="212" y="220" width="9" height="40" rx="3"/>
  <rect class="sb" x="379" y="184" width="9" height="64" rx="3"/>

  <!-- номера у кнопок -->
  <circle cx="190" cy="150" r="15" fill="#d4a012"/><text x="190" y="156" text-anchor="middle" fill="#141414" font-size="17" font-weight="700">1</text>
  <circle cx="190" cy="282" r="15" fill="#d4a012"/><text x="190" y="288" text-anchor="middle" fill="#141414" font-size="17" font-weight="700">2</text>
  <circle cx="412" cy="166" r="15" fill="#d4a012"/><text x="412" y="172" text-anchor="middle" fill="#141414" font-size="17" font-weight="700">3</text>

  <!-- палец слева (жмёт громкость): кончик у кнопок, группа сдвигается анимацией -->
  <g class="lf">
    <rect x="58" y="196" width="150" height="40" rx="20" fill="#e2ac85" stroke="#b9805a" stroke-width="2"/>
    <rect x="168" y="203" width="30" height="26" rx="11" fill="#f3cdb3" stroke="#c9946f" stroke-width="1.5"/>
    <path d="M86 205 q8 11 0 22" stroke="#b9805a" stroke-width="2" fill="none"/>
  </g>
  <!-- большой палец справа (держит боковую) -->
  <g class="rt">
    <rect x="389" y="194" width="170" height="44" rx="22" fill="#e2ac85" stroke="#b9805a" stroke-width="2"/>
    <rect x="398" y="201" width="32" height="30" rx="12" fill="#f3cdb3" stroke="#c9946f" stroke-width="1.5"/>
    <path d="M520 204 q-8 12 0 24" stroke="#b9805a" stroke-width="2" fill="none"/>
  </g>

  <!-- полоска удержания -->
  <rect x="200" y="414" width="200" height="8" rx="4" fill="#333"/>
  <rect class="bar" x="200" y="414" width="200" height="8" rx="4" fill="#d4a012"/>

  <!-- субтитры: крупная строка + пояснение -->
  <rect x="0" y="436" width="600" height="124" fill="#111"/>
  <g class="s1">
    <text x="300" y="486" text-anchor="middle" fill="#ffd54a" font-size="34" font-weight="700">1 · Громкость +</text>
    <text x="300" y="526" text-anchor="middle" fill="#f5e6c8" font-size="24">нажать и сразу отпустить</text>
  </g>
  <g class="s2" opacity="0">
    <text x="300" y="486" text-anchor="middle" fill="#ffd54a" font-size="34" font-weight="700">2 · Громкость −</text>
    <text x="300" y="526" text-anchor="middle" fill="#f5e6c8" font-size="24">нажать и сразу отпустить</text>
  </g>
  <g class="s3" opacity="0">
    <text x="300" y="486" text-anchor="middle" fill="#ffd54a" font-size="34" font-weight="700">3 · Держать боковую</text>
    <text x="300" y="526" text-anchor="middle" fill="#f5e6c8" font-size="24">10–20 с; экран погаснет — не отпускайте</text>
  </g>
  <g class="s4" opacity="0">
    <text x="300" y="486" text-anchor="middle" fill="#7fd48a" font-size="34" font-weight="700">Появился логотип ✓</text>
    <text x="300" y="526" text-anchor="middle" fill="#f5e6c8" font-size="24">отпускайте — телефон загружается</text>
  </g>
</svg>
