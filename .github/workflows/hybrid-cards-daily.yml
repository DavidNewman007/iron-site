# Проверка hybrid-карточек: audit → match → build → deploy.
# Автозапуск по cron отключён (2026-07-09). Ручной запуск: Actions → Daily hybrid cards refresh.
name: Daily hybrid cards refresh

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hybrid-cards-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync, audit, build missing cards and push
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 scripts/refresh_hybrid_cards.py --all

      # Push от GITHUB_TOKEN не запускает другие workflow — деплоим здесь же.
      - name: Prepare site config
        run: cp public/js/config.example.js public/js/config.js

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - id: deployment
        name: Deploy site to GitHub Pages
        uses: actions/deploy-pages@v4
