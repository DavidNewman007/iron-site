# Ежедневная проверка hybrid-карточек: audit → match → build → deploy.
#
# Расписание: 09:30 по Москве (06:30 UTC) — раньше, чем прайс обновится в 11:00,
# чтобы прогон не столкнулся с записью листов из Apps Script.
#
# ⚠️ Автозапуск был отключён 09.07.2026 и снова включён 18.09.2026 по просьбе
# владельца: «если появляются новые товары на сайте — можно делать карточки
# автоматом». Технической причины отключения в коммите 867f5c4e не названо, это
# было решение, а не поломка. Что делает прогон: досинхронизирует листы прайса,
# находит позиции без карточки, сопоставляет их с каталогом поставщика, качает
# фотографии, собирает страницы и деплоит сайт. Новые позиции получают карточку
# сами, руками ничего запускать не надо.
name: Daily hybrid cards refresh

on:
  schedule:
    # 09:30 MSK (UTC+3)
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hybrid-cards-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync, audit, build missing cards and push
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 scripts/refresh_hybrid_cards.py --all

      # Push от GITHUB_TOKEN не запускает другие workflow — деплоим здесь же.
      - name: Prepare site config
        run: cp public/js/config.example.js public/js/config.js

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - id: deployment
        name: Deploy site to GitHub Pages
        uses: actions/deploy-pages@v4
